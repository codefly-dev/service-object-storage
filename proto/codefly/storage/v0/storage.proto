syntax = "proto3";

// Package codefly.storage.v0 is the generic object-storage data plane: one
// uniform API a client speaks, that a single server translates to S3, GCS,
// Azure Blob, or MinIO behind it. No provider is ever named in this API — the
// client never links a cloud SDK. The surface is the honest intersection the
// industry converged on (OpenDAL / gocloud.dev/blob / object_store); anything
// backend-specific lives behind Native().
package codefly.storage.v0;

option go_package = "github.com/codefly-dev/service-object-storage/gen/codefly/storage/v0;storagev0";

// ObjectInfo is the object's metadata — and every field a caching layer needs.
// ETag is an OPAQUE strong validator, never a content hash (multipart/SSE ETags
// are not MD5). weak_etag marks a validator the cache must not use to stitch
// ranges. version_id (S3/Azure) and generation (GCS) make version-pinned reads
// immutable and cacheable forever.
message ObjectInfo {
  string key = 1;
  string etag = 2;
  bool weak_etag = 3;
  int64 size = 4;
  // last_modified as Unix milliseconds (0 = unknown).
  int64 last_modified_unix_ms = 5;
  string version_id = 6;
  int64 generation = 7;
  int64 metageneration = 8;
  string content_type = 9;
  string content_encoding = 10;
  string cache_control = 11;
  map<string, string> user_metadata = 12;
}

// ByteRange is a half-open [offset, offset+length) window; length <= 0 means
// "to end of object".
message ByteRange {
  int64 offset = 1;
  int64 length = 2;
}

// CacheStatus reports how the gateway served a read, for observability. A
// presigned large-object read never reaches the cache (BYPASS_PRESIGN).
enum CacheStatus {
  CACHE_STATUS_UNSPECIFIED = 0;
  CACHE_STATUS_MISS = 1;
  CACHE_STATUS_HIT_L1 = 2;
  CACHE_STATUS_HIT_L2 = 3;
  CACHE_STATUS_REVALIDATED = 4;
  CACHE_STATUS_NEGATIVE = 5;
  CACHE_STATUS_NO_STORE = 6;
}

message StatRequest {
  string key = 1;
  string version_id = 2;
  // Conditional stat: empty means unconditional.
  string if_none_match = 3;
  string if_match = 4;
}

message GetRequest {
  string key = 1;
  string version_id = 2;
  ByteRange range = 3;
  string if_none_match = 4;
  string if_match = 5;
  int64 if_modified_since_unix_ms = 6;
}

// GetResponse streams: the first message carries the header (info + not_modified
// + cache_status), every following message carries a data chunk.
message GetResponse {
  oneof kind {
    GetHeader header = 1;
    bytes data = 2;
  }
}

message GetHeader {
  ObjectInfo info = 1;
  // not_modified is true when a conditional read matched — no data follows.
  bool not_modified = 2;
  CacheStatus cache_status = 3;
}

// PutRequest streams: the first message MUST be the header, every following
// message a data chunk. The server transparently uses multipart when needed;
// the client never sees parts.
message PutRequest {
  oneof kind {
    PutHeader header = 1;
    bytes data = 2;
  }
}

message PutHeader {
  string key = 1;
  string content_type = 2;
  string content_encoding = 3;
  string cache_control = 4;
  map<string, string> user_metadata = 5;
  // if_none_match = "*" means create-if-absent (fails if the object exists).
  string if_none_match = 6;
  // if_match = <etag> means overwrite-if-unchanged (compare-and-swap).
  string if_match = 7;
  // total_size is a hint (-1 = unknown / streaming).
  int64 total_size = 8;
}

message PutResult {
  string etag = 1;
  string version_id = 2;
  int64 generation = 3;
}

message DeleteRequest {
  string key = 1;
  string version_id = 2;
  string if_match = 3;
}

message DeleteResult {}

message DeleteManyRequest {
  repeated string keys = 1;
}

// DeleteManyResult reports per-key outcomes — batch delete is not atomic on any
// backend, so partial failure is normal and surfaced per key.
message DeleteManyResult {
  repeated DeleteEntry entries = 1;
}

message DeleteEntry {
  string key = 1;
  // error is empty on success.
  string error = 2;
}

message ListRequest {
  string prefix = 1;
  string delimiter = 2;
  string page_token = 3;
  int32 limit = 4;
}

// ListResult — objects plus synthetic common_prefixes ("directories"). Ordering
// is NOT guaranteed. page_token is opaque; empty next_page_token ends iteration.
message ListResult {
  repeated ObjectInfo objects = 1;
  repeated string common_prefixes = 2;
  string next_page_token = 3;
}

message CopyRequest {
  string source_key = 1;
  string dest_key = 2;
  // if_none_match = "*" means copy-only-if-dest-absent.
  string if_none_match = 3;
}

message CopyResult {
  string etag = 1;
  string version_id = 2;
}

enum PresignMethod {
  PRESIGN_METHOD_UNSPECIFIED = 0;
  PRESIGN_METHOD_GET = 1;
  PRESIGN_METHOD_PUT = 2;
}

message PresignRequest {
  string key = 1;
  PresignMethod method = 2;
  int64 expiry_seconds = 3;
}

// PresignResult is a time-limited URL the client fetches directly over plain
// HTTP — no cloud SDK. The gateway clamps expiry to the backend maximum.
message PresignResult {
  PresignMethod method = 1;
  string url = 2;
  map<string, string> headers = 3;
  int64 expires_at_unix_ms = 4;
}

// WriteOp is the mutating operation a WriteEvent reports.
enum WriteOp {
  WRITE_OP_UNSPECIFIED = 0;
  WRITE_OP_PUT = 1;
  WRITE_OP_DELETE = 2;
}

message WatchRequest {
  // prefix scopes the stream to keys under it; empty means every key.
  string prefix = 1;
}

// WriteEvent is a single mutation observed at the gateway write choke point: a
// change HINT a consumer keeping an index (cache, metadata DB) reacts to, not a
// lossless log. etag/version_id are set on PUT when the backend returns them; a
// DELETE carries only the key (and version_id when a specific version was
// removed).
//
// Delivery is best-effort and at-least-once, so a consumer MUST periodically
// reconcile against authoritative state (List / version enumeration) and never
// treat the absence of an event as proof no write happened:
//   - Events for writes served by OTHER replicas travel over the shared cache
//     tier's pub/sub, which is fire-and-forget: a Redis outage or a subscriber
//     reconnect drops those events with no per-event signal.
//   - A DELETE is emitted even when the key was already absent — backends do not
//     report whether a delete removed anything — so deletes are not one-to-one
//     with real state changes.
//   - A consumer that receives RESOURCE_EXHAUSTED has fallen too far behind and
//     was dropped; it must reconcile before re-watching.
// Writes served by the SAME replica the client is watching are delivered
// in-order (or the slow client is dropped), so a single-replica gateway loses
// events only via RESOURCE_EXHAUSTED.
message WriteEvent {
  string key = 1;
  WriteOp op = 2;
  string etag = 3;
  string version_id = 4;
  int64 time_unix_ms = 5;
}

message CapabilitiesRequest {}

// Capabilities is the OpenDAL-style introspection surface: a client asks what
// this backend honors before it calls, instead of discovering by failure.
message BackendCapabilities {
  string backend = 1;
  bool conditional_put = 2;
  bool conditional_copy = 3;
  bool atomic_rename = 4;
  bool versions = 5;
  bool tags = 6;
  bool presign = 7;
  int64 presign_max_expiry_seconds = 8;
  bool presign_ambient_creds = 9;
  int32 batch_delete_max = 10;
  repeated string native_verbs = 11;
}

message ReadyRequest {}

// Readiness is the gateway's live view of ACCESS to the configured
// bucket/container: the result of a non-mutating probe against the backing
// store. It is the complement of BackendCapabilities — capabilities are static
// feature introspection that reaches no network and proves nothing about
// connectivity or credentials.
//
// The RPC itself succeeds whenever the gateway is serving, exactly as the gRPC
// health protocol does; an unready gateway is reported as ready=false with the
// cause, so a caller distinguishes "the gateway is unreachable" from "the
// gateway is up but its store is not". detail is a backend error message and
// never carries credentials.
message Readiness {
  bool ready = 1;
  string backend = 2;
  // code is the normalized failure class when ready is false, empty otherwise:
  // "Unavailable" (endpoint unreachable), "NotFound" (missing bucket or
  // container), "PermissionDenied" (credentials refused), "Unsupported" (the
  // backend cannot honor the configured probe strategy), "Internal".
  string code = 3;
  string detail = 4;
  int64 checked_at_unix_ms = 5;
}

message NativeRequest {
  string verb = 1;
  map<string, string> params = 2;
}

// NativeResult is the escape hatch for backend-specific operations (ACLs, tiers,
// object-lock, leases, …) that the portable surface deliberately excludes.
message NativeResult {
  map<string, string> values = 1;
}

// ObjectStorage is the generic data plane. Errors are returned as gRPC status
// codes normalized across backends: NOT_FOUND, ALREADY_EXISTS,
// FAILED_PRECONDITION (conditional/CAS), UNIMPLEMENTED (unsupported),
// PERMISSION_DENIED, RESOURCE_EXHAUSTED (throttled), INTERNAL.
service ObjectStorage {
  rpc Stat(StatRequest) returns (GetHeader);
  rpc Get(GetRequest) returns (stream GetResponse);
  rpc Put(stream PutRequest) returns (PutResult);
  rpc Delete(DeleteRequest) returns (DeleteResult);
  rpc DeleteMany(DeleteManyRequest) returns (DeleteManyResult);
  rpc List(ListRequest) returns (ListResult);
  rpc Copy(CopyRequest) returns (CopyResult);
  rpc Presign(PresignRequest) returns (PresignResult);
  // Watch streams write events (Put/Delete) as they complete through the
  // gateway. With a shared cache tier configured, events from other replicas
  // bound to the same backend location are mirrored in best-effort (see
  // WriteEvent for the delivery contract — it is a hint stream, not a log). The
  // stream's initial gRPC header marks the subscription as live: events are live
  // and never replayed, so a client reconciles state from before the header out
  // of band, and periodically thereafter to recover any dropped events.
  rpc Watch(WatchRequest) returns (stream WriteEvent);
  rpc Capabilities(CapabilitiesRequest) returns (BackendCapabilities);
  // Ready probes the backing store and reports whether the configured
  // bucket/container is reachable with the credentials in force. Every call
  // probes: readiness that was true at startup is never replayed.
  rpc Ready(ReadyRequest) returns (Readiness);
  rpc Native(NativeRequest) returns (NativeResult);
}

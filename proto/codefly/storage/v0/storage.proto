syntax = "proto3";

// Package codefly.storage.v0 is the generic object-storage data plane: one
// uniform API a client speaks, that a single server translates to S3, GCS,
// Azure Blob, or MinIO behind it. No provider is ever named in this API — the
// client never links a cloud SDK. The surface is the honest intersection the
// industry converged on (OpenDAL / gocloud.dev/blob / object_store); anything
// backend-specific lives behind Native().
package codefly.storage.v0;

option go_package = "github.com/codefly-dev/service-object-storage/gen/codefly/storage/v0;storagev0";

// ObjectInfo is the object's metadata, including the validators a consumer
// needs for conditional reads. ETag is an OPAQUE strong validator, never a
// content hash (multipart/SSE ETags are not MD5). weak_etag marks a validator a
// consumer must not use to stitch ranges. version_id (S3/Azure) and generation
// (GCS) make version-pinned reads immutable.
message ObjectInfo {
  string key = 1;
  string etag = 2;
  bool weak_etag = 3;
  int64 size = 4;
  // last_modified as Unix milliseconds (0 = unknown).
  int64 last_modified_unix_ms = 5;
  string version_id = 6;
  int64 generation = 7;
  int64 metageneration = 8;
  string content_type = 9;
  string content_encoding = 10;
  string cache_control = 11;
  map<string, string> user_metadata = 12;
}

// ByteRange is a half-open [offset, offset+length) window; length <= 0 means
// "to end of object".
message ByteRange {
  int64 offset = 1;
  int64 length = 2;
}

// CacheStatus is deprecated and kept only so existing generated clients keep
// compiling: the gateway no longer caches and never sets it, so every
// GetHeader carries CACHE_STATUS_UNSPECIFIED. Do not reuse its numbers.
enum CacheStatus {
  option deprecated = true;
  CACHE_STATUS_UNSPECIFIED = 0;
  CACHE_STATUS_MISS = 1;
  CACHE_STATUS_HIT_L1 = 2;
  CACHE_STATUS_HIT_L2 = 3;
  CACHE_STATUS_REVALIDATED = 4;
  CACHE_STATUS_NEGATIVE = 5;
  CACHE_STATUS_NO_STORE = 6;
}

// Binding names a bucket the gateway is NOT configured for: a store the caller
// reaches with its own credential, for this one call. A request that carries a
// binding runs against it and never touches the gateway's configured bucket;
// a request without one is unchanged. Only Stat, Get, GetMany, List and
// Capabilities take a binding — the reads a datasource pull needs.
//
// The binding is an argument, not a configuration: the gateway opens a client
// for the call, drops it when the call returns, and never stores, logs or
// returns the credential: bound error messages are scrubbed of it, and so are
// the responses the SDKs see. (The debug_redact marks below are honoured by
// the runtimes that implement the option; protobuf-go does not.) Every dial a bound call makes is checked against the
// concrete address being connected to — on the first request and on every
// redirect — and an address that is not on the public internet is refused
// with PERMISSION_DENIED. A named endpoint is resolved and judged before the
// first dial as well, so the refusal names it. Bound reads are capped: see
// BackendCapabilities.max_object_bytes and max_list_limit; every response a
// store sends a bound call is bounded to max_object_bytes. Each bound
// operation (a List, Stat, Get, Capabilities, or GetMany item) must complete
// within 30 seconds, body included, and a whole GetMany within 10 minutes, or
// the call fails UNAVAILABLE; both deadlines start before the endpoint is
// qualified, so its DNS resolution is inside them.
//
// A bound List never answers an incomplete listing as complete: a page the
// store marks truncated without a continuation token, or one with more
// entries than the page asked for, fails the call. An empty next_page_token
// on a successful page means the listing is complete.
message Binding {
  // kind is a registered remote backend: "s3", "minio", "gcs" or "azure".
  string kind = 1;
  // endpoint is an http(s) origin with no path, query or userinfo. Empty means
  // the kind's public service: AWS S3 for "s3", Cloud Storage for "gcs",
  // https://<account>.blob.core.windows.net for "azure". "minio" requires one.
  // S3-style stores ("s3", "minio") are addressed path-style.
  string endpoint = 2;
  // region signs S3-style requests; empty means "us-east-1".
  string region = 3;
  // bucket is the bucket (S3, MinIO, GCS) or container (Azure).
  string bucket = 4;
  // prefix confines the call to keys under it, and keys in requests and
  // results are relative to it. It is a literal key prefix, used exactly as
  // written: "/reports/" lists keys beginning "/reports/", "/" is not the
  // whole bucket, "reports" also matches "reports-2024/…". (Unlike SOS_PREFIX,
  // which the gateway normalizes for its own bucket, a bound read's scope is
  // never rewritten: its result can authorize deletions.)
  string prefix = 5;
  // credential authenticates this call. It is required: a bound call never
  // falls back to the gateway's own identity.
  Credential credential = 6;
}

// Credential is the caller's credential for one bound call.
message Credential {
  oneof kind {
    // access_key authenticates "s3" and "minio" (access key id and secret
    // access key) and "azure" (storage account name and shared account key).
    AccessKey access_key = 1;
    // service_account_key is a Google service-account JSON key, for "gcs".
    // No other Google credential type is accepted.
    bytes service_account_key = 2 [debug_redact = true];
    // access_token is a short-lived OAuth2 access token, for "gcs": the
    // bearer for this one call, minted by the caller (for example by service
    // account impersonation) where keys are forbidden. The gateway sends it
    // as is — no refresh, no exchange — so an expired token is refused by the
    // store, with the store's answer, as PERMISSION_DENIED.
    string access_token = 3 [debug_redact = true];
  }
}

// ScopeMode selects which of a scope's three storage identities a call runs
// under. They are separate sessions with separate grants: none holds what
// another holds beyond what is listed.
enum ScopeMode {
  SCOPE_MODE_UNSPECIFIED = 0;
  // READ reads and lists objects of the scope. It writes and deletes nothing.
  SCOPE_MODE_READ = 1;
  // INGEST writes objects of the scope, multipart included. It reads, lists
  // and deletes nothing.
  SCOPE_MODE_INGEST = 2;
  // MAINTENANCE copies and deletes inside the scope, and reads and lists what
  // it needs to do so.
  SCOPE_MODE_MAINTENANCE = 3;
}

// Scope confines one call on the gateway's OWN configured bucket to one scope
// of the key convention (libs/go/objectkey): the keys under
// "<base>/<partition>/<scope>/". The gateway obtains a short-lived credential
// from the store's issuer whose grant is that prefix and that mode, and makes
// the call with it instead of its own credential, so a key outside the scope
// is refused by the store itself, whatever key the request names. The caller
// holds neither credential.
//
// Keys in a scoped request are what they are without one: relative to the
// gateway's bucket and prefix. A scope is not a binding and the two never
// travel together. A gateway that does not offer scoped sessions, or whose
// store has no qualified issuer, refuses a scoped call with
// FAILED_PRECONDITION (SCOPED_SESSIONS_UNAVAILABLE): it never falls back to
// its own credential. A scope the authenticated caller was not granted is
// PERMISSION_DENIED (SCOPE_NOT_GRANTED), one whose session policy would exceed
// the store's limit is FAILED_PRECONDITION (SCOPE_POLICY_TOO_LARGE), and an
// issuer that does not answer is UNAVAILABLE (SCOPE_ISSUER_UNAVAILABLE).
message Scope {
  // base is the key convention's base: one segment of lowercase letters,
  // digits and hyphens.
  string base = 1;
  // partition is the wall no call crosses (a tenant).
  string partition = 2;
  // scope is the scope inside the partition (an installation).
  string scope = 3;
  ScopeMode mode = 4;
}

message AccessKey {
  string id = 1;
  string secret = 2 [debug_redact = true];
  // Required with temporary S3 or MinIO credentials issued by STS.
  string session_token = 3 [debug_redact = true];
}

message StatRequest {
  string key = 1;
  string version_id = 2;
  // Conditional stat: empty means unconditional.
  string if_none_match = 3;
  string if_match = 4;
  // binding, when set, reads a bucket named by the caller — see Binding.
  Binding binding = 5;
  // scope, when set, runs the call under a scoped session — see Scope.
  Scope scope = 6;
}

message GetRequest {
  string key = 1;
  string version_id = 2;
  ByteRange range = 3;
  string if_none_match = 4;
  string if_match = 5;
  int64 if_modified_since_unix_ms = 6;
  // binding, when set, reads a bucket named by the caller — see Binding.
  Binding binding = 7;
  // scope, when set, runs the call under a scoped session — see Scope.
  Scope scope = 8;
}

// GetResponse streams: the first message carries the header (info +
// not_modified), every following message carries a data chunk.
message GetResponse {
  oneof kind {
    GetHeader header = 1;
    bytes data = 2;
  }
}

message GetHeader {
  ObjectInfo info = 1;
  // not_modified is true when a conditional read matched — no data follows.
  bool not_modified = 2;
  // cache_status is kept only for wire and generated-client compatibility: the
  // gateway no longer caches and always leaves it unset
  // (CACHE_STATUS_UNSPECIFIED).
  CacheStatus cache_status = 3 [deprecated = true];
}

// GetManyRequest reads several objects in one call: in request order, each
// only at the ETag the caller listed. It exists so a caller that syncs a
// listing (a datasource pull) pays one call per batch rather than one per
// object. At most BackendCapabilities.max_get_many_items items per call.
message GetManyRequest {
  repeated GetManyItem items = 1;
  // binding, when set, reads a bucket named by the caller — see Binding. The
  // bound caps apply to every item.
  Binding binding = 2;
  // scope, when set, runs every item under one scoped session — see Scope.
  Scope scope = 3;
}

message GetManyItem {
  string key = 1;
  // if_match is the ETag the caller listed; the object is read only if it
  // still has it. Empty reads whatever version is current.
  string if_match = 2;
}

// GetManyResponse streams, per item in request order: one header, then — when
// the outcome is OK — data chunks whose total is exactly header.info.size. A
// header for the next item starts the next object. An error that is not about
// one item (credentials refused, store unreachable, guard refusal, a missing
// bucket or container) ends the stream with its status instead. The size is
// enforced: a body that runs longer or shorter ends the stream with ABORTED,
// and a stream that ends with an error leaves its current item incomplete.
message GetManyResponse {
  oneof kind {
    GetManyHeader header = 1;
    bytes data = 2;
  }
}

message GetManyHeader {
  // index is the item's position in GetManyRequest.items.
  int32 index = 1;
  GetManyOutcome outcome = 2;
  // info is set when outcome is OK.
  ObjectInfo info = 3;
}

// GetManyOutcome is what happened to one item. Only OK is followed by data.
enum GetManyOutcome {
  GET_MANY_OUTCOME_UNSPECIFIED = 0;
  GET_MANY_OUTCOME_OK = 1;
  // CHANGED: the object no longer has the if_match ETag.
  GET_MANY_OUTCOME_CHANGED = 2;
  // NOT_FOUND: the key does not exist (deleted since it was listed).
  GET_MANY_OUTCOME_NOT_FOUND = 3;
  // TOO_LARGE: a bound read of an object over max_object_bytes.
  GET_MANY_OUTCOME_TOO_LARGE = 4;
}

// PutRequest streams: the first message MUST be the header, every following
// message a data chunk. The server transparently uses multipart when needed;
// the client never sees parts.
message PutRequest {
  oneof kind {
    PutHeader header = 1;
    bytes data = 2;
  }
}

message PutHeader {
  string key = 1;
  string content_type = 2;
  string content_encoding = 3;
  string cache_control = 4;
  map<string, string> user_metadata = 5;
  // if_none_match = "*" means create-if-absent (fails if the object exists).
  string if_none_match = 6;
  // if_match = <etag> means overwrite-if-unchanged (compare-and-swap).
  string if_match = 7;
  // total_size is a hint (-1 = unknown / streaming).
  int64 total_size = 8;
  // scope, when set, runs the write under a scoped session — see Scope.
  Scope scope = 9;
}

message PutResult {
  string etag = 1;
  string version_id = 2;
  int64 generation = 3;
}

message DeleteRequest {
  string key = 1;
  string version_id = 2;
  string if_match = 3;
  // scope, when set, runs the delete under a scoped session — see Scope.
  Scope scope = 4;
}

message DeleteResult {}

message DeleteManyRequest {
  repeated string keys = 1;
  // scope, when set, runs the deletes under one scoped session — see Scope.
  Scope scope = 2;
}

// DeleteManyResult reports per-key outcomes — batch delete is not atomic on any
// backend, so partial failure is normal and surfaced per key.
message DeleteManyResult {
  repeated DeleteEntry entries = 1;
}

message DeleteEntry {
  string key = 1;
  // error is empty on success.
  string error = 2;
}

message ListRequest {
  string prefix = 1;
  string delimiter = 2;
  string page_token = 3;
  int32 limit = 4;
  // binding, when set, lists a bucket named by the caller — see Binding.
  Binding binding = 5;
  // scope, when set, runs the call under a scoped session — see Scope.
  Scope scope = 6;
}

// ListResult — objects plus synthetic common_prefixes ("directories"). Ordering
// is NOT guaranteed. page_token is opaque; empty next_page_token ends iteration.
message ListResult {
  repeated ObjectInfo objects = 1;
  repeated string common_prefixes = 2;
  string next_page_token = 3;
}

message CopyRequest {
  string source_key = 1;
  string dest_key = 2;
  // if_none_match = "*" means copy-only-if-dest-absent.
  string if_none_match = 3;
  // scope, when set, runs the copy under a scoped session: both keys must be
  // in it — see Scope.
  Scope scope = 4;
}

message CopyResult {
  string etag = 1;
  string version_id = 2;
}

enum PresignMethod {
  PRESIGN_METHOD_UNSPECIFIED = 0;
  PRESIGN_METHOD_GET = 1;
  PRESIGN_METHOD_PUT = 2;
  // POST is a browser form upload whose policy the store checks: the one
  // method that can bound the size of what is uploaded. It needs
  // content_length_max, and a store that cannot sign one answers UNIMPLEMENTED.
  PRESIGN_METHOD_POST = 3;
}

// PresignRequest signs a URL for exactly one key and one method. A URL is a
// capability nothing can take back before it expires.
//
// With a scope, the URL is signed by the scope's session, so the store also
// refuses it outside the scope and it dies with the session. A scoped presign
// is the gateway's opt-in direct mode and is bounded: the gateway must have
// it enabled, GET needs a READ scope and PUT or POST an INGEST scope, the key
// must be an object of the scope under the key convention, and
// expiry_seconds must be explicit and within the gateway's scoped presign
// limit; anything else is refused, never clamped. A URL lists nothing.
message PresignRequest {
  string key = 1;
  PresignMethod method = 2;
  int64 expiry_seconds = 3;
  // scope, when set, signs with a scoped session — see above and Scope.
  Scope scope = 4;
  // content_type, on PUT or POST, is the exact Content-Type the upload must
  // carry: PUT signs the header (returned in headers, and the upload must
  // send it), POST states it in the policy. A store that cannot bind it
  // answers UNIMPLEMENTED rather than sign an unbounded URL.
  string content_type = 5;
  // content_length_max, on POST, is the most bytes the upload may carry; the
  // store refuses a larger body. It is refused on PUT, where no store this
  // gateway signs for can bound a size.
  int64 content_length_max = 6;
  // content_length_min, on POST, is the fewest bytes; 0 means none.
  int64 content_length_min = 7;
}

// PresignResult is a time-limited URL the client fetches directly over plain
// HTTP — no cloud SDK. The gateway clamps expiry to the backend maximum.
message PresignResult {
  PresignMethod method = 1;
  string url = 2;
  map<string, string> headers = 3;
  int64 expires_at_unix_ms = 4;
  // form_fields, on POST, are the fields the multipart form must carry, in
  // addition to the file itself, which goes last under the name "file".
  map<string, string> form_fields = 5;
}

// WriteOp is the mutating operation a WriteEvent reports.
enum WriteOp {
  WRITE_OP_UNSPECIFIED = 0;
  WRITE_OP_PUT = 1;
  WRITE_OP_DELETE = 2;
}

message WatchRequest {
  // prefix scopes the stream to keys under it; empty means every key.
  string prefix = 1;
}

// WriteEvent is a single mutation observed at the gateway write choke point: a
// change HINT a consumer keeping an index (search index, metadata DB) reacts
// to, not a lossless log. etag/version_id are set on PUT when the backend
// returns them; a DELETE carries only the key (and version_id when a specific
// version was removed).
//
// Delivery is per replica: a Watch stream carries the writes served by the
// replica the client is connected to, never writes served by other replicas.
// A consumer that needs every write to the bucket across replicas uses the
// backing store's event notifications instead.
//
// Delivery is best-effort and at-least-once, so a consumer MUST periodically
// reconcile against authoritative state (List / version enumeration) and never
// treat the absence of an event as proof no write happened:
//   - Writes served by other replicas, or made to the bucket directly, are
//     never delivered on this stream.
//   - A DELETE is emitted even when the key was already absent — backends do not
//     report whether a delete removed anything — so deletes are not one-to-one
//     with real state changes.
//   - A consumer that receives RESOURCE_EXHAUSTED has fallen too far behind and
//     was dropped; it must reconcile before re-watching.
// Writes served by the replica the client is watching are delivered in-order
// (or the slow client is dropped), so a single-replica gateway loses events
// only via RESOURCE_EXHAUSTED.
message WriteEvent {
  string key = 1;
  WriteOp op = 2;
  string etag = 3;
  string version_id = 4;
  int64 time_unix_ms = 5;
}

message CapabilitiesRequest {
  // binding, when set, asks what a bound call honors — see Binding. Only the
  // read surface is reported for it: backend, versions and the two caps; every
  // write, presign and native field is unset, because a bound call can reach
  // only Stat, Get, GetMany and List.
  Binding binding = 1;
}

// Capabilities is the OpenDAL-style introspection surface: a client asks what
// this backend honors before it calls, instead of discovering by failure.
message BackendCapabilities {
  string backend = 1;
  bool conditional_put = 2;
  bool conditional_copy = 3;
  bool atomic_rename = 4;
  bool versions = 5;
  bool tags = 6;
  bool presign = 7;
  int64 presign_max_expiry_seconds = 8;
  bool presign_ambient_creds = 9;
  int32 batch_delete_max = 10;
  repeated string native_verbs = 11;
  // max_object_bytes is the largest object a bound Get streams; a larger one
  // is refused with RESOURCE_EXHAUSTED. 0 means the gateway sets no cap, which
  // is the case for its configured bucket.
  int64 max_object_bytes = 12;
  // max_list_limit is the most objects one bound List page returns; a larger
  // or zero ListRequest.limit is clamped to it. Page with next_page_token for
  // more. 0 means the gateway sets no cap.
  int32 max_list_limit = 13;
  // max_get_many_items is the most items one GetManyRequest may carry; more is
  // INVALID_ARGUMENT. It applies with or without a binding.
  int32 max_get_many_items = 14;
  // scoped_sessions is whether this gateway runs calls under scoped sessions:
  // "" or "off" (a scoped call is refused), "allow" (a call may carry a
  // Scope), or "require" (a call on the configured bucket must carry one).
  string scoped_sessions = 15;
  // scoped_session_issuer is the qualification of the store's session issuer:
  // "qualified", or "unqualified" where the mechanism is described and was
  // never proven against the real store, which keeps scoped sessions off.
  string scoped_session_issuer = 16;
}

message ReadyRequest {}

// Readiness is the gateway's live view of ACCESS to the configured
// bucket/container: the result of a non-mutating probe against the backing
// store. It is the complement of BackendCapabilities — capabilities are static
// feature introspection that reaches no network and proves nothing about
// connectivity or credentials.
//
// The RPC itself succeeds whenever the gateway is serving, exactly as the gRPC
// health protocol does; an unready gateway is reported as ready=false with the
// cause, so a caller distinguishes "the gateway is unreachable" from "the
// gateway is up but its store is not". detail is a backend error message and
// never carries credentials.
message Readiness {
  bool ready = 1;
  string backend = 2;
  // code is the normalized failure class when ready is false, empty otherwise:
  // "Unavailable" (no answer — endpoint unreachable, or the probe deadline
  // expired first), "NotFound" (missing bucket or container),
  // "PermissionDenied" (credentials refused), "Internal".
  string code = 3;
  string detail = 4;
  // checked_at_unix_ms is when the reported probe completed, so a caller can
  // judge how fresh this answer is: it is at most one probe interval old. It is
  // 0 before the first probe has landed, which is reported as not ready.
  int64 checked_at_unix_ms = 5;
}

message NativeRequest {
  string verb = 1;
  map<string, string> params = 2;
}

// NativeResult is the escape hatch for backend-specific operations (ACLs, tiers,
// object-lock, leases, …) that the portable surface deliberately excludes.
message NativeResult {
  map<string, string> values = 1;
}

// ObjectStorage is the generic data plane. Errors are returned as gRPC status
// codes normalized across backends: NOT_FOUND, ALREADY_EXISTS,
// FAILED_PRECONDITION (conditional/CAS), UNIMPLEMENTED (unsupported),
// PERMISSION_DENIED, RESOURCE_EXHAUSTED, ABORTED, UNAVAILABLE, INTERNAL.
//
// Every refusal also names its reason: a google.rpc.ErrorInfo in the status
// details, domain "object-storage.codefly.dev", beside the unchanged message.
// Act on the reason, not the code — one code covers refusals that call for
// different actions:
//   PERMISSION_DENIED   DESTINATION_REFUSED (the guard: refuse the source),
//                       CREDENTIAL_REJECTED (the store: re-authorise; under a
//                       Scope it is the store refusing a key outside the
//                       scope or a verb outside the mode, and carries
//                       metadata scoped=true, mode, store_code),
//                       SCOPE_NOT_GRANTED, SCOPE_REQUIRED
//   RESOURCE_EXHAUSTED  STORE_THROTTLED (back off; carries a
//                       google.rpc.RetryInfo — the store's Retry-After, or a
//                       1 s default, metadata retry_delay_source=store|default),
//                       OBJECT_TOO_LARGE (skip the object; max_bytes),
//                       RESPONSE_TOO_LARGE (max_bytes),
//                       LISTING_TOO_LONG (entries, max_entries),
//                       WATCH_CONSUMER_BEHIND (reconcile, then re-watch)
//   NOT_FOUND           OBJECT_NOT_FOUND, BUCKET_NOT_FOUND
//   INVALID_ARGUMENT    BINDING_INVALID, SCOPE_INVALID, PRESIGN_REFUSED,
//                       TOO_MANY_ITEMS (max_items), INVALID_ARGUMENT
//   UNAVAILABLE         OPERATION_DEADLINE (per_operation, per_get_many),
//                       ENDPOINT_UNRESOLVED, STORE_UNAVAILABLE,
//                       SCOPE_ISSUER_UNAVAILABLE
//   ABORTED             BODY_SIZE_MISMATCH (declared_bytes, sent_bytes)
//   INTERNAL            LISTING_INCOMPLETE, INTERNAL
//   FAILED_PRECONDITION PRECONDITION_FAILED, SCOPED_SESSIONS_UNAVAILABLE,
//                       SCOPE_POLICY_TOO_LARGE;  ALREADY_EXISTS ALREADY_EXISTS;
//   UNIMPLEMENTED       UNSUPPORTED
service ObjectStorage {
  rpc Stat(StatRequest) returns (GetHeader);
  rpc Get(GetRequest) returns (stream GetResponse);
  // GetMany streams several objects in one call — see GetManyRequest.
  rpc GetMany(GetManyRequest) returns (stream GetManyResponse);
  rpc Put(stream PutRequest) returns (PutResult);
  rpc Delete(DeleteRequest) returns (DeleteResult);
  rpc DeleteMany(DeleteManyRequest) returns (DeleteManyResult);
  rpc List(ListRequest) returns (ListResult);
  rpc Copy(CopyRequest) returns (CopyResult);
  rpc Presign(PresignRequest) returns (PresignResult);
  // Watch streams write events (Put/Delete) as they complete through the
  // replica the client is connected to; writes served by other replicas are not
  // delivered (see WriteEvent for the delivery contract — it is a hint stream,
  // not a log). The
  // stream's initial gRPC header marks the subscription as live: events are live
  // and never replayed, so a client reconciles state from before the header out
  // of band, and periodically thereafter to recover any dropped events.
  rpc Watch(WatchRequest) returns (stream WriteEvent);
  rpc Capabilities(CapabilitiesRequest) returns (BackendCapabilities);
  // Ready reports whether the configured bucket/container is reachable with the
  // credentials in force, as of the gateway's most recent background probe.
  // It does not probe per call: doing so made this RPC an unpaced amplifier
  // onto the cloud API. Use checked_at_unix_ms to judge freshness.
  rpc Ready(ReadyRequest) returns (Readiness);
  rpc Native(NativeRequest) returns (NativeResult);
}

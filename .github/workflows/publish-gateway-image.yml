name: publish-gateway-image

# Builds the gateway image and pushes it by digest, carrying no tag. Nothing
# resolves it yet: release.yml creates the tags consumers use, from the digest
# gateway-image.json records.
#
# It runs before the release tag rather than from it. The agent pins the digest
# it runs, and a digest is only known once the image is built — so a tag cut
# before the build can never carry it. Publishing here, recording the digest in
# a commit, and tagging afterwards is what lets the released agent name the
# image that was actually built for its version.
#
# The build, the version check, the default-branch refusal and the lock artifact
# all come from core's publish-service-image action. The job stays here because
# GHCR authorizes the repository that *defines* the job: a job defined in core
# was denied write access to this repository's package, which is why core ships
# a composite action — a step inside this job — rather than a reusable workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Upcoming stable agent version reported by codefly publish --dry-run (without v)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    # The action refuses any other event, and the caller owns the gate: a
    # composite action cannot declare job policy.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      lock: ${{ steps.publish.outputs.lock }}
    steps:
      # No `ref`: the action requires HEAD to be the triggering commit, so a
      # ref override cannot publish a tree other than the one dispatched.
      # Full history for the ancestry proof, and no persisted credential — the
      # action refuses a checkout that left one in the local git config, since
      # the build context would otherwise carry it into the image.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Nothing may run between the checkout and this step: the action proves
      # the build context is the clean, merged, triggering commit, and any step
      # that writes a file — generated code, a version stamp, a cache — makes
      # the tree dirty and is refused.
      #
      # platforms is passed explicitly although it matches the action's default:
      # it is this repository's shipped-platform declaration, asserted against
      # internal/imageevidence.Platforms by TestShippedPlatformsMatchTheReleasePipeline,
      # so evidence can never cover fewer platforms than the release ships.
      - uses: codefly-dev/core/.github/actions/publish-service-image@5b9dbf5d7f03dd048d7b741dc8b79ab2bc407ab3 # v0.19.4
        id: publish
        with:
          version: ${{ inputs.version }}
          platforms: linux/amd64,linux/arm64
          registry-token: ${{ secrets.GITHUB_TOKEN }}

name: release-image

# Publishes the object-storage gateway container the agent runs. The tag tracks
# the release tag so codefly.dev/object-storage@<version> resolves a matching
# image.
on:
  push:
    tags:
      - 'v*'

jobs:
  gateway-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/codefly-dev/service-object-storage:${{ steps.version.outputs.version }}
            ghcr.io/codefly-dev/service-object-storage:latest
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # Evidence for every platform the push just shipped, generated by the same
      # code path the agent's Builder.SBOM uses, so each document is bound to the
      # child manifest digest inside the document itself. A platform that
      # resolves to no manifest fails the release: publishing an image whose
      # contents were never inventoried is what the contract exists to prevent.
      - name: image SBOM evidence
        run: >
          go run ./cmd/image-sbom
          -image ghcr.io/codefly-dev/service-object-storage:${{ steps.version.outputs.version }}
          -out sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-image-sbom-${{ steps.version.outputs.version }}
          path: sbom/
          if-no-files-found: error

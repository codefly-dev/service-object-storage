name: release-image

# Publishes the object-storage gateway container the agent runs. The tag tracks
# the release tag so codefly.dev/object-storage@<version> resolves a matching
# image.
on:
  push:
    tags:
      - 'v*'

jobs:
  gateway-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/codefly-dev/service-object-storage:${{ steps.version.outputs.version }}
            ghcr.io/codefly-dev/service-object-storage:latest

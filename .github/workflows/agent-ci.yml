# Full-lifecycle agent validation: `codefly agent ci` runs the source, release,
# and generated-service conformance gates against this agent, through the shared
# reusable workflow every codefly service agent uses.
#
# The source-packager is no longer a pin compiled into the CLI (cli#499's pin
# was later replaced by runtime selection): `codefly agent ci` uses the
# `source.agent` that agent.codefly.yaml declares, so moving the packager is an
# edit to that file, not a CLI bump. With codefly-cli-version below and that
# declaration, the gate passes against this repo's Go 1.27.2 module.
#
# Manual (workflow_dispatch) only. Making it a pull_request gate is a separate
# decision, not part of moving a pin.
name: agent-ci

on:
  workflow_dispatch:

jobs:
  agent-ci:
    # Pinned to an immutable core commit SHA, not @main (see ci.yml for why).
    uses: codefly-dev/core/.github/workflows/agent-ci.yml@ce29e08b80e0a328acb61138faf57a4c58b5049f # v0.19.5
    with:
      codefly-cli-version: "0.1.188"

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned to an immutable core commit SHA, not @main: a mutable ref lets an
    # upstream change alter this repo's gate — which runs with this repo's token
    # — with no commit here. Bump deliberately alongside the go.mod core version.
    uses: codefly-dev/core/.github/workflows/go-service-ci.yml@29bc3dbdda86cc5b3432f17c249bc49301a2edad

  # The shared go-service-ci runs `go test` without the race detector; this
  # repo's cache, events hub, and Watch streams are concurrent, so keep race
  # coverage the old build-test job had.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...

  integration-minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      # The MinIO this repository builds from source (minio-image.json): MinIO's
      # own registries no longer serve anonymous pulls. Same digest the agent
      # runs, so this job and the e2e job exercise one MinIO version.
      - name: start minio
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            ghcr.io/codefly-dev/minio@sha256:6db9ae5fd307001ad5bb1899a8a4b8f69aebe982f95b7085416953b5f4cc22a5 server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live
      # The gcs backend's integration tests run against fake-gcs-server, which the
      # Go storage SDK reaches natively through STORAGE_EMULATOR_HOST. Without it
      # those tests skip and the job still passes, so it is started here.
      - name: start fake-gcs-server
        run: |
          docker run -d --name fake-gcs -p 4443:4443 \
            fsouza/fake-gcs-server@sha256:d47b4cf8b87006cab8fbbecfa5f06a2a3c5722e464abddc0d107729663d40ec4 \
            -scheme http -public-host 127.0.0.1:4443
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4443/storage/v1/b && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4443/storage/v1/b
      - name: integration test
        env:
          MINIO_ENDPOINT: 127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: sos-test
          STORAGE_EMULATOR_HOST: 127.0.0.1:4443
          GCS_BUCKET: sos-test
        run: go test -tags integration ./internal/integration/...

  agent-runtime-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build gateway image
        run: docker build -t service-object-storage:e2e .
      # The Runtime pulls this itself; fetching it first keeps a registry failure
      # from surfacing as a Runtime timeout. The digest is minio-image.json's.
      - name: fetch the exact runtime MinIO image
        run: docker pull ghcr.io/codefly-dev/minio@sha256:6db9ae5fd307001ad5bb1899a8a4b8f69aebe982f95b7085416953b5f4cc22a5
      - name: end-to-end put/get through the agent runtime
        env:
          SOS_GATEWAY_IMAGE: service-object-storage:e2e
        run: go test -tags e2e -count=1 -timeout 300s .

  # Inventories a real gateway image through the agent's own image-SBOM path and
  # checks it against the shared coverage contract, so a change that would ship
  # an uninventoried image fails here rather than at release.
  image-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build gateway image
        run: docker build -t service-object-storage:e2e .
      # The daemon holds this image and no registry serves it, so the scan needs
      # syft on PATH: the managed containerized scanner has no Docker access.
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: assert the image contract against a real image
        env:
          SOS_GATEWAY_IMAGE: service-object-storage:e2e
        run: go test -tags e2e -count=1 -timeout 300s -run TestImageSBOM .
      - name: write evidence through the release command
        run: go run ./cmd/image-sbom -image service-object-storage:e2e -local -out sbom
      # The local image is single-platform and reached through the daemon. The
      # image a release publishes is neither: it is multi-architecture and
      # resolved through the registry. Without this step the two-platform path
      # the release depends on would never execute in CI.
      # It inventories the digest gateway-image.json records — the image the
      # agent actually names — so a lock pointing at something that does not
      # resolve, or that ships fewer platforms than evidence has to cover, fails
      # here rather than at release time.
      - name: inventory the published multi-architecture image
        run: |
          set -euo pipefail
          go run ./cmd/image-sbom -image "$(jq -er '.name + "@" + .digest' gateway-image.json)" -out sbom-published
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-image-sbom
          path: |
            sbom/
            sbom-published/
          # A skipped scan writes nothing; failing here keeps a green job from
          # standing in for evidence that was never produced.
          if-no-files-found: error

name: release

# Everything a `v*` tag publishes, in dependency order: the gateway container
# the agent runs, then the GitHub release carrying the agent binary. The agent
# resolves its gateway from the embedded agent.codefly.yaml, so a release
# published without its image points every consumer at a tag no registry
# serves. One workflow, so a failure anywhere stops what follows.
on:
  push:
    tags:
      - 'v*'

env:
  IMAGE: ghcr.io/codefly-dev/service-object-storage

jobs:
  # A tag whose tests fail publishes nothing. go-service-release.yml gates the
  # binary on its own test job, but a caller cannot depend on a job inside the
  # workflow it calls, so the image needs this gate of its own — otherwise a
  # failing test still leaves an untested image tagged :latest.
  # Its own job rather than a step in gateway-image: that job holds packages:
  # write and an authenticated ghcr session, and the whole test tree has no
  # business running under a registry-write token.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  gateway-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The image tag comes from the git tag, while the agent resolves its
      # gateway from the embedded agent.codefly.yaml. A tag ahead of the file
      # publishes one image and ships an agent that pulls another — and the one
      # it pulls is the previous release, which exists, so nothing fails at run
      # time and the evidence describes an image the agent never runs.
      - name: Tag matches the agent version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          embedded=$(awk '$1 == "version:" {print $2}' agent.codefly.yaml)
          if [ "$embedded" != "$VERSION" ]; then
            echo "release tag $VERSION does not match agent.codefly.yaml $embedded" >&2
            exit 1
          fi
      # Pushed by digest, carrying no tag. Until the evidence step below
      # succeeds there is no tag for a consumer to resolve, so a failed scan
      # cannot leave a usable image behind.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # Evidence for every platform the build shipped, generated by the same code
      # path the agent's Builder.SBOM uses, so each document is bound to the child
      # manifest digest inside the document itself. It scans the index digest the
      # build just produced rather than a tag, so the evidence describes exactly
      # the bytes that are about to be tagged.
      - name: image SBOM evidence
        run: >
          go run ./cmd/image-sbom
          -image ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          -out sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-image-sbom-${{ steps.version.outputs.version }}
          path: sbom/
          if-no-files-found: error
      # Only now does the image become resolvable by the tags consumers use. A
      # platform that resolved to no manifest, or a scan that failed, has already
      # failed the job above, leaving the digest untagged and unreferenced.
      - name: Publish the release tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$DIGEST"

  # The binary ships last: only once the image it points at is published and
  # inventoried is the GitHub release that carries the agent worth creating.
  release:
    needs: gateway-image
    # Pinned to an immutable core commit SHA, not @main (see ci.yml). This call
    # carries secrets: inherit, so a mutable ref would hand an upstream change
    # this repo's GH_PAT with no commit here — the risk ci.yml pins against,
    # on the one call that actually inherits the token. Bump deliberately.
    uses: codefly-dev/core/.github/workflows/go-service-release.yml@bcd5a65a0ee2e696e4a15e90e8cb09434d787437
    secrets: inherit
